name: tourism_planner
description: AI 기반 여행 플래너 앱 - 자연어로 최적 여행 코스를 추천해드립니다
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP
  http: ^1.2.0
  # State management
  provider: ^6.1.2
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  # Maps
  url_launcher: ^6.3.0
  # Utils
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
